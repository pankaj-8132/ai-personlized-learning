[project]
name = "learnloop"
version = "0.1.0"
description = "Vectorless reasoning-based RAG pipeline for student study PDFs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.31.0",
    "networkx>=3.6.1",
    "pageindex>=0.4.4",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "tenacity>=9.1.4",
]

[project.scripts]
learnloop = "learnloop.cli:main"

[dependency-groups]
dev = [
    "fpdf2>=2.8.9",
    "pytest>=9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
