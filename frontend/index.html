<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LearnLoop</title><link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>LearnLoop</h1><span id="who"></span><button id="logout" class="ghost hidden">Log out</button></header>

<main id="auth" class="card narrow">
  <h2>Sign in</h2>
  <input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password (6+ chars)">
  <div class="row"><button id="login">Log in</button><button id="register" class="ghost">Register</button></div>
  <p id="autherr" class="err"></p>
</main>

<main id="app" class="hidden">
  <section class="card">
    <h2>1. Your documents</h2>
    <div class="row"><input type="file" id="file" accept=".pdf,.txt,.md"><button id="upload">Upload</button></div>
    <ul id="docs" class="list"></ul>
  </section>

  <div id="workspace" class="hidden">
    <h2 id="docname"></h2>
    <nav class="tabs">
      <button data-tab="ask" class="on">Ask the document</button>
      <button data-tab="learn">Practice</button>
      <button data-tab="dash">Mastery dashboard</button>
    </nav>

    <section id="tab-ask" class="card">
      <p class="muted">Answers come only from this document. Anything else is refused.</p>
      <div class="row"><input id="q" placeholder="Ask something about the document"><button id="askbtn">Ask</button></div>
      <div id="answer"></div>
    </section>

    <section id="tab-learn" class="card hidden">
      <button id="extract">Extract concept map</button>
      <div id="conceptlist"></div>
      <div id="quizbox"></div>
    </section>

    <section id="tab-dash" class="card hidden">
      <button id="refresh" class="ghost">Refresh</button>
      <div id="dash"></div>
    </section>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
